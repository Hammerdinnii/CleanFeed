<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Video - YouTube</title></head>
  <body>
    <ytd-app>
      <div id="player-container-outer"><div id="player"><video id="vid"></video></div></div>
      <ytd-watch-metadata>
        <div id="description">
          <div>How this content was made</div>
          <div>Altered or synthetic content</div>
          <div>Sound or visuals were significantly edited or digitally generated.</div>
        </div>
      </ytd-watch-metadata>
      <div id="related">
        <ytd-compact-video-renderer id="yt-blocked">
          <a href="/watch?v=zzzzzzzzzz1"><img src="" /></a>
          <span id="video-title">Ten facts about the ocean</span>
          <ytd-channel-name><a href="/@SlopChannel">Slop Channel</a></ytd-channel-name>
        </ytd-compact-video-renderer>
        <ytd-compact-video-renderer id="yt-ok">
          <a href="/watch?v=zzzzzzzzzz2"><img src="" /></a>
          <span id="video-title">How I rebuilt my grandfather's workbench</span>
          <ytd-channel-name><a href="/@WoodShop">Wood Shop</a></ytd-channel-name>
        </ytd-compact-video-renderer>
        <ytd-ad-slot-renderer id="yt-ad">Sponsored</ytd-ad-slot-renderer>
      </div>
    </ytd-app>
  </body>
</html>
